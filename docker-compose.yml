version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger_control_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_control}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ledger_control}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledger_control_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_NAME: "Ledger Control API"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ledger_control}
      SECRET_KEY: ${SECRET_KEY:-change_this_in_production_to_a_secure_random_hex_string_32_chars}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","https://app.ledgercontrol.com"]'
      STORAGE_LOCAL_DIR: "./storage/uploads"
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  backend_storage:
